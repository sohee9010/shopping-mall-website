name: CI

# PR마다 린트 → 타입 검사 → 빌드를 실행한다.
# main 브랜치 push 때는 deploy.yml이 이 워크플로를 workflow_call로 호출하고,
# 통과해야만 배포 단계로 넘어간다. (main push에서 CI가 두 번 돌지 않도록 push 트리거는 두지 않음)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소해 러너 시간을 아낀다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
