name: Supabase keep-alive

# Supabase 무료 플랜은 일정 기간(현재 약 1주) 활동이 없으면 프로젝트를 일시정지하고,
# 오래 방치하면 복구할 수 없게 된다. (원본 팀 프로젝트의 DB가 사라진 원인으로 추정)
# 3일마다 공개 API로 가벼운 조회를 1번 보내 활성 상태를 유지한다.
#
# 참고: GitHub은 저장소에 60일 동안 활동(push 등)이 없으면 예약 실행(schedule)을 자동으로 멈춘다.
#       그 경우 Actions 탭에서 이 워크플로를 다시 활성화하거나 Run workflow로 수동 실행한다.
on:
  schedule:
    - cron: '0 0 */3 * *' # 3일마다 00:00 UTC (한국 09:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query a public table
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }} # 브라우저에 공개되는 키 (RLS로 보호)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1")
          echo "Supabase 응답: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase가 응답하지 않습니다 (HTTP $status). 대시보드에서 프로젝트가 일시정지되었는지 확인하세요."
            exit 1
          fi
